project:
  name: cloud_removal_india_fast_check
  seed: 42
  root: /teamspace/studios/this_studio/cloud_removal_india

paths:
  data_root: /teamspace/studios/this_studio/cloud_removal_india/data_fast
  raw_dir: /teamspace/studios/this_studio/cloud_removal_india/data_fast/raw
  patch_dir: /teamspace/studios/this_studio/cloud_removal_india/data_fast/patches
  split_dir: /teamspace/studios/this_studio/cloud_removal_india/data_fast/splits
  model_dir: /teamspace/studios/this_studio/cloud_removal_india/models_fast
  result_dir: /teamspace/studios/this_studio/cloud_removal_india/results_fast
  log_dir: /teamspace/studios/this_studio/cloud_removal_india/logs

data:
  patch_size: 128
  patch_bbox_degrees: 0.06
  patch_attempts_per_scene: 2
  samples_per_regime: 3
  min_total_samples: 5
  max_scenes_per_regime: 15
  cloudy_min_fraction: 0.00
  cloudy_max_fraction: 1.00
  clear_max_fraction: 0.25
  max_temporal_gap_days: 60
  sentinel2_bands: [B02, B03, B04, B08, B11, B12]
  sentinel1_bands: [vv, vh]
  cloud_scl_classes: [3, 8, 9, 10]
  normalize_percentiles: [1, 99]

regimes:
  western_ghats:
    bbox: [73.0, 10.0, 76.0, 14.5]
  northeast_india:
    bbox: [91.0, 24.0, 95.5, 27.5]
  thar_desert:
    bbox: [69.5, 25.0, 73.5, 28.5]

dates:
  start: "2023-01-01"
  end: "2024-12-31"

training:
  device: cuda
  precision: amp
  num_workers: 2
  detector:
    epochs: 1
    batch_size: 4
    lr: 0.0003
    encoder: resnet34
  remover:
    epochs: 1
    batch_size: 2
    lr: 0.0002
    lambda_l1: 1.0
    lambda_ssim: 0.25
    lambda_sam: 0.10
    lambda_cloud: 4.0

validation:
  holdout_regimes: [thar_desert]
  external:
    enable_sen12mscr: false
    enable_cloudsen12: false
    enable_sparcs: false
